services:
  catalog:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${CATALOG_PORT:-3001}:3001"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      DATABASE_PATH: /app/data/catalog.sqlite
    volumes:
      - catalog-data:/app/data
volumes:
  catalog-data:
